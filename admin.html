<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NextGen.Tesla | Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:18px 24px}main{max-width:1100px;margin:25px auto;padding:0 15px}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:18px}input,textarea,button{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:7px;border:1px solid #d1d5db}button{background:#111827;color:#fff;border:0;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}
</style></head><body><header><strong>NextGen.Tesla — Admin</strong></header><main>
<div id="loginCard" class="card"><h2>Administrator Login</h2><form id="form"><input id="em" type="email" placeholder="Admin email" required><input id="pw" type="password" placeholder="Password" required><button>Login</button></form><p id="status"></p></div>
<div id="panel" style="display:none"><div class="card"><h2>Members</h2><div id="members">Loading...</div></div>
<div class="card"><h2>Edit Member</h2><input id="mid" placeholder="Member UUID"><input id="bal" type="number" step=".01" placeholder="Balance"><input id="inv" type="number" step=".01" placeholder="Investment"><input id="prof" type="number" step=".01" placeholder="Profit"><textarea id="msg" placeholder="Customer service message"></textarea><button id="save">Save Changes</button><p id="saveStatus"></p></div></div>
</main><script>
const db=supabase.createClient('https://bbqoxzgugsayxtehckjy.supabase.co','sb_publishable_3Sy9D98gdTf96Qa3e3QEAQ_WeigCJUA');
form.onsubmit=async e=>{e.preventDefault();status.textContent="Signing in...";const r=await db.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(r.error){status.textContent=r.error.message;return}const a=await db.from("admins").select("id").eq("id",r.data.user.id).single();if(a.error||!a.data){await db.auth.signOut();status.textContent="Not authorized as administrator.";return}loginCard.style.display="none";panel.style.display="block";load()};
async function load(){const r=await db.from("profiles").select("*").order("registration_date",{ascending:false});if(r.error){members.textContent=r.error.message;return}members.innerHTML="<table><tr><th>Email</th><th>Balance</th><th>Investment</th><th>Profit</th></tr>"+r.data.map(x=>"<tr><td>"+(x.email||"")+"</td><td>$"+Number(x.balance||0).toFixed(2)+"</td><td>$"+Number(x.investment||0).toFixed(2)+"</td><td>$"+Number(x.profit||0).toFixed(2)+"</td></tr>").join("")+"</table>"}
save.onclick=async()=>{const r=await db.from("profiles").update({balance:Number(bal.value||0),investment:Number(inv.value||0),profit:Number(prof.value||0),support_message:msg.value}).eq("id",mid.value.trim());saveStatus.textContent=r.error?r.error.message:"Member updated successfully.";if(!r.error)load()};
</script></body></html>
