<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NextGen.Tesla | Member Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;margin:0;background:#f5f7fb;color:#111827}header{background:#111827;color:#fff;padding:18px 24px;display:flex;justify-content:space-between}main{max-width:900px;margin:30px auto;padding:0 18px}.card{background:#fff;padding:22px;border-radius:14px;margin-bottom:18px;box-shadow:0 3px 14px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.stat{background:#f9fafb;padding:18px;border-radius:10px}input,button{padding:12px;border-radius:8px;font-size:15px}input{width:100%;box-sizing:border-box;margin:7px 0 12px;border:1px solid #d1d5db}button{background:#111827;color:#fff;border:0;cursor:pointer}.hidden{display:none}.muted{color:#6b7280}
</style></head>
<body>
<header><strong>NextGen.Tesla</strong><button id="logout" class="hidden">Logout</button></header>
<main>
<section id="auth" class="card"><h2>Member Login</h2><form id="login"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button>Login</button></form><p id="message" class="muted"></p></section>
<section id="dashboard" class="hidden">
<div class="card"><h2>Welcome, <span id="memberEmail"></span></h2><p class="muted">Registration date: <span id="registered">—</span></p></div>
<div class="grid"><div class="stat"><b>Balance</b><h2 id="balance">$0.00</h2></div><div class="stat"><b>Investment</b><h2 id="investment">$0.00</h2></div><div class="stat"><b>Profit</b><h2 id="profit">$0.00</h2></div></div>
<div class="card"><h2>Withdrawal</h2><input id="amount" type="number" min=".01" step=".01" placeholder="Amount"><button id="withdraw">Request Withdrawal</button><p id="withdrawMsg" class="muted"></p></div>
<div class="card"><h2>Customer Service</h2><p id="support">Our team is available to assist you.</p></div>
</section></main>
<script>
const db=supabase.createClient('https://bbqoxzgugsayxtehckjy.supabase.co','sb_publishable_3Sy9D98gdTf96Qa3e3QEAQ_WeigCJUA');
async function load(user){
 const r=await db.from("profiles").select("*").eq("id",user.id).single();
 if(r.error){message.textContent=r.error.message;return}
 auth.classList.add("hidden");dashboard.classList.remove("hidden");logout.classList.remove("hidden");
 memberEmail.textContent=user.email||r.data.email||"";registered.textContent=r.data.registration_date?new Date(r.data.registration_date).toLocaleString():"—";
 balance.textContent="$"+Number(r.data.balance||0).toFixed(2);investment.textContent="$"+Number(r.data.investment||0).toFixed(2);profit.textContent="$"+Number(r.data.profit||0).toFixed(2);
 support.textContent=r.data.support_message||"Our team is available to assist you.";
}
login.onsubmit=async e=>{e.preventDefault();message.textContent="Signing in...";const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){message.textContent=r.error.message;return}load(r.data.user)};
logout.onclick=async()=>{await db.auth.signOut();location.reload()};
withdraw.onclick=()=>{withdrawMsg.textContent=Number(amount.value)>0?"Your withdrawal request can be reviewed by the administrator.":"Please enter a valid amount."};
db.auth.getSession().then(r=>{if(r.data.session)load(r.data.session.user)});
</script></body></html>
